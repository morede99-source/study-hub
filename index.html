<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة الشروحات — Murad Alzaaq</title>
<meta name="description" content="منصة شروحات المواد بالصوت والصورة — أمن الشبكات، الدوائر الكهربائية، مختبر بايثون">
<meta name="theme-color" content="#F7F7FB">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%237077E0'/><path d='M9 11l7-4 7 4-7 4z M11 13v5c0 2 10 2 10 0v-5' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>">
<style>
:root{--bg:#F7F7FB;--card:#FFFFFF;--ink:#16182B;--ink2:#3B3F5C;--mut:#7A7F99;--line:#E7E8F1;--ac:#7077E0;--ac2:#5A61CF;--yl:#F5C84C;
--lav:#CBC7F2;--cor:#F5B6A8;--yel:#F7D77A;--min:#AEDDC4;--pea:#F9CBA5;--sky:#BBD9F3;--rd:#E5675A;--gr:#2FA572;
--sh:0 1px 2px rgba(22,24,43,.04),0 8px 24px -12px rgba(22,24,43,.14);--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans Arabic","Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.75;-webkit-font-smoothing:antialiased}
.en,[dir=ltr]{font-family:"Inter","Noto Sans Arabic",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
/* ---------- header */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:12px 20px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand .mk{width:34px;height:34px;border-radius:10px;background:var(--ac);display:grid;place-items:center}
.brand b{font-size:17px;font-weight:800;display:block;line-height:1.2}
.brand small{display:block;font:700 9.5px "Inter";letter-spacing:2.2px;color:var(--mut)}
nav.top{display:flex;gap:22px;font-size:15px;font-weight:600;color:var(--ink2)}
nav.top a{position:relative;padding:6px 0}
nav.top a.on{color:var(--ink)}
nav.top a.on:after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;border-radius:3px;background:var(--yl)}
.sp{flex:1}
.credit{display:flex;align-items:center;gap:10px;padding:5px 16px 5px 6px;border:1px solid var(--line);border-radius:999px;background:#fff;white-space:nowrap;box-shadow:var(--sh)}
.credit .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 12px "Inter";color:#fff;background:linear-gradient(135deg,var(--ac),#9AA0F0)}
.credit .who{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.credit .who small{font:700 8.5px "Inter";letter-spacing:1.4px;color:var(--mut)}
.credit .who b{font:800 15px "Inter";color:var(--ink);letter-spacing:.2px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;cursor:pointer;color:var(--ink2);font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center}
.iconbtn:hover{border-color:var(--ac);color:var(--ac)}
main{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
/* ---------- hero + search */
.hero{text-align:center;padding:34px 0 26px}
.hero h1{font-size:clamp(26px,4vw,40px);font-weight:800;line-height:1.35;letter-spacing:-.2px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,rgba(245,200,76,.55) 62%)}
.hero p{color:var(--mut);font-size:16.5px;margin:8px auto 0;max-width:620px}
.search{display:flex;max-width:560px;margin:22px auto 0;background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.search:focus-within{border-color:var(--ac)}
.search input{flex:1;min-width:0;border:0;outline:0;padding:13px 16px;font:15px "Noto Sans Arabic","Inter";background:none;color:var(--ink)}
.search button{flex-shrink:0;border:0;background:var(--ac);color:#fff;width:52px;display:grid;place-items:center;cursor:pointer}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:14px;margin-bottom:6px;flex-wrap:wrap}
.crumbs a{color:var(--ac);font-weight:600}
h2.sec{font-size:21px;font-weight:800;margin:26px 0 14px;display:flex;align-items:center;gap:10px}
h2.sec:after{content:"";flex:1;height:1px;background:var(--line)}
/* ---------- cards (academy style) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;transition:transform .18s,box-shadow .18s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 2px 4px rgba(22,24,43,.05),0 22px 40px -18px rgba(22,24,43,.28)}
.thumb{aspect-ratio:16/11;display:grid;place-items:center;position:relative}
.thumb svg{width:44%;height:auto}
.thumb .tag{position:absolute;top:12px;inset-inline-start:12px;font:700 11px "Inter";background:rgba(255,255,255,.85);color:var(--ink);padding:3px 9px;border-radius:999px;direction:ltr}
.thumb .dur{position:absolute;bottom:12px;inset-inline-end:12px;font:700 11.5px "Inter";background:rgba(22,24,43,.82);color:#fff;padding:3px 9px;border-radius:8px;direction:ltr}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:17.5px;font-weight:800;line-height:1.45}
.cb p{font-size:13.5px;color:var(--mut);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.by{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink2)}
.by .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 9px "Inter";color:#fff;background:linear-gradient(135deg,var(--ac),#9AA0F0)}
.by .en{font-weight:700;white-space:nowrap}
.by .meta{margin-inline-start:auto;color:var(--mut);font-size:12px;display:flex;gap:6px}
.pill{white-space:nowrap;font-size:11.5px;padding:2px 9px;border-radius:999px;background:#F1F1F8;color:var(--ink2);font-weight:600}
.pill.ac{background:#ECEDFC;color:var(--ac2)}
.card.soon{opacity:.6;cursor:default}.card.soon:hover{transform:none}
/* ---------- panels */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:18px;box-shadow:var(--sh)}
.panel h3{font-size:18px;font-weight:800;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.panel ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.panel li{padding-inline-start:22px;position:relative;font-size:15.5px}
.panel li:before{content:"";position:absolute;inset-inline-start:2px;top:11px;width:8px;height:8px;border-radius:3px;background:var(--yl)}
.panel b{color:var(--ac2)}
.panel code{font:600 13px "Inter",monospace;background:#F1F1F8;padding:2px 7px;border-radius:6px;color:var(--ink);word-break:break-word}
.banner{display:flex;gap:14px;align-items:flex-start;background:#FFF8E1;border-color:#F3E2A6;margin-top:0}
.banner .bi{font-size:26px;line-height:1}
.src{font-size:12.5px;color:var(--mut);margin-top:12px}
.pagehead{display:flex;align-items:center;gap:16px;margin:8px 0 18px}
.pagehead .ph{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
.pagehead .ph svg{width:62%}
.pagehead h1{font-size:clamp(22px,3.2vw,32px);font-weight:800;line-height:1.35}
.pagehead p{color:var(--mut);font-size:14.5px}
/* video */
.tp{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;align-items:start}
.player{border-radius:var(--r);overflow:hidden;background:#000;box-shadow:0 24px 48px -24px rgba(22,24,43,.45)}
.player video{display:block;width:100%;aspect-ratio:16/9;background:#EDEDF5}
.chap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;max-height:520px;overflow:auto;box-shadow:var(--sh)}
.chap h4{font-size:13.5px;color:var(--mut);padding:6px 8px 8px;font-weight:700}
.chap button{display:flex;gap:10px;align-items:center;width:100%;text-align:right;border:0;background:none;color:var(--ink);font-size:14.5px;padding:9px 10px;border-radius:12px;cursor:pointer}
.chap button:hover{background:#F4F4FA}
.chap button.on{background:#ECEDFC}
.chap .n{flex-shrink:0;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 12px "Inter";background:#F1F1F8;color:var(--ink2)}
.chap button.on .n{background:var(--ac);color:#fff}
.chap .tm{margin-inline-start:auto;color:var(--mut);font:600 12px "Inter";direction:ltr}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.given{background:#F4F4FF;border:1px dashed #C9CBF4;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15px}
ol.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
ol.steps li{counter-increment:s;padding:10px 14px;padding-inline-start:46px;position:relative;border-radius:12px;background:#F7F7FB;font-size:15px}
ol.steps li:before{content:counter(s);position:absolute;inset-inline-start:12px;top:10px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:700 12px "Inter";background:var(--ac);color:#fff}
ol.steps li:last-child{background:#E9F7EF;border:1px solid #BFE6CF}
.gt{width:100%;border-collapse:collapse}.gt td{padding:10px 8px;border-bottom:1px solid var(--line)}
.gt td:last-child{text-align:left;font-weight:800;color:var(--ac2)}.gt tfoot td{border-top:2px solid var(--ink);border-bottom:0}
.q{font-size:16px;margin-bottom:12px}
.btn{border:0;cursor:pointer;font-weight:700;font-size:15px;padding:10px 18px;border-radius:12px;background:var(--ac);color:#fff}
.btn:hover{background:var(--ac2)}
.btn.ghost{background:#fff;color:var(--ac2);border:1.5px solid #C9CBF4}
.ans{display:none;margin-top:14px}.ans.on{display:block}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:#fff;border:0}
.cta b{color:#fff;font-size:18px}.cta p{color:#C9CBE0;font-size:14px}
/* quiz */
.score{position:sticky;top:70px;z-index:10;display:flex;align-items:center;gap:12px;margin-top:0;padding:12px 18px}
.score .big{font:800 24px "Inter";color:var(--gr)}
.score .bar{flex:1;height:8px;border-radius:8px;background:#F1F1F8;overflow:hidden}.score .bar i{display:block;height:100%;width:0;background:var(--gr);transition:width .3s}
.qset{display:flex;gap:14px;align-items:center}.qset .ph{width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.qc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.qh{display:flex;gap:12px;align-items:flex-start}
.qn{flex-shrink:0;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#ECEDFC;color:var(--ac2);font:800 13px "Inter"}
.qt{flex:1;font:600 16px/1.6 "Inter",sans-serif;text-align:left;color:var(--ink)}
.lec{flex-shrink:0;font:700 11px "Inter";padding:3px 9px;border-radius:999px;background:#FFF3CF;color:#8A6A00;direction:ltr}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.opts.tf{max-width:420px}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 14px;font:500 15px/1.45 "Inter",sans-serif;cursor:pointer}
.opt b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#F1F1F8;margin-right:8px;font-size:12.5px}
.opt:hover{border-color:var(--ac)}
.qc.done .opt{cursor:default}.qc.done .opt:hover{border-color:var(--line)}
.opt.right{background:#E9F7EF;border-color:var(--gr)!important}.opt.right b{background:var(--gr);color:#fff}
.opt.wrong{background:#FDECEA;border-color:var(--rd)!important}.opt.wrong b{background:var(--rd);color:#fff}
.exp{display:none;margin-top:12px}.exp.on{display:block}
.verdict{font-weight:800;margin-bottom:6px}
.ar{background:#F4F4FF;border-inline-start:4px solid var(--ac);border-radius:10px;padding:10px 14px;font-size:15.5px}
.model{background:#F3FAF6;border:1px solid #CFEBDC;border-radius:12px;padding:12px 16px;margin-bottom:10px;text-align:left;font:15px/1.6 "Inter",sans-serif}
.model .mh{font-weight:800;color:var(--gr);margin-bottom:6px}
.model ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}.model b{color:var(--ac2)}
.model code{font-size:13px;background:#fff;padding:1px 6px;border-radius:6px}
.qc.essay .btn{margin-top:12px}
.qcode{margin:12px 0 0 42px;background:#16182B;color:#E6E8F5;border-radius:12px;padding:12px 16px;font:500 14px/1.6 "DejaVu Sans Mono",ui-monospace,monospace;overflow:auto;text-align:left;white-space:pre}
@media (max-width:640px){.qcode{margin-left:0;font-size:12.5px}}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 10px 40px;border-top:1px solid var(--line);background:#fff}
footer b{color:var(--ink)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;transition:.3s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--mut);padding:30px}
@media (max-width:900px){.tp{grid-template-columns:1fr}.chap{max-height:none}.two{grid-template-columns:1fr}nav.top{display:none}}
@media (max-width:640px){.hwrap{gap:10px;padding:10px 12px}.brand small{display:none}.credit{padding:4px 10px 4px 4px;gap:7px}.credit .av{width:28px;height:28px;font-size:10.5px}.credit .who small{font-size:7.5px;letter-spacing:.8px}.credit .who b{font-size:13px}.iconbtn .lbl{display:none}main{padding:14px 12px 50px}.panel{padding:16px}.opts{grid-template-columns:1fr}.score{top:60px}.hero{padding:20px 0 14px}}
@media (max-width:640px){.grid{grid-template-columns:1fr 1fr;gap:12px}.thumb{aspect-ratio:4/3}.thumb .tag{top:8px;inset-inline-start:8px;font-size:10px}.cb{padding:10px 12px 12px}.cb h3{font-size:15px}.cb p{font-size:12.5px}.by .en{display:none}.by .meta{margin-inline-start:0}}
@media (max-width:420px){.brand>div{display:none}}
</style>
</head>

<script>
const SUBJ = [{"slug": "netsec", "ic": "shield", "bg": "var(--lav)", "title": "أمن الحاسب والشبكات", "icon": "🛡️", "code": "COE455", "color": "#FF8A80", "sub": "ميدتيرم 2: Syslog · SNMP · AAA · ACL · Firewalls", "intro": "شرح محاضرات ميدتيرم 2: الشرائح بالإنجليزي مثل ما هي، والشرح بالعربي، مع اختبار من بنك الأسئلة.", "banner": "<b>من إعلان الدكتور:</b> تحديد ميدتيرم 2 = <b>المحاضرات 4 و 5 و 6</b> · نوعيات الأسئلة المعتادة (اختيار من متعدد، صح وخطأ، مقالي) · أسئلة التدريب في <b>Tasks</b>.", "topics": [{"slug": "ns4", "title": "Lecture 4 — Syslog · NTP · SNMP · AAA", "icon": "📡", "ic": "router", "bg": "var(--lav)", "lec": "NS-Lecture-4", "ideaTitle": "أهم النقاط للاختبار", "idea": ["<b>Routing protocol spoofing</b>: تحديثات توجيه مزيفة ← التلاعب بجدول التوجيه وتحويل الترافيك (loops · مراقبة · رمي).", "<b>OSPF authentication</b>: MD5 (ضعيف) أو <b>SHA</b> (الأقوى ✓).", "<b>Syslog</b> على <b>UDP 514</b> · المستويات 0–7 · <b>الرقم الأصغر = الأخطر</b> (0 Emergency … 7 Debugging).", "<b>NTP</b> (RFC 1305) يزامن الوقت · <b>UDP 123</b> · الضبط اليدوي غير مستحسن.", "<b>SNMP</b>: Manager · Agent · MIB · أوامر get / set / trap · <b>UDP 161</b> (polling) و <b>UDP 162</b> (traps) · <b>SNMPv3</b> هو الآمن.", "<b>AAA</b>: Authentication (مين أنت) · Authorization (وش تقدر تسوي) · Accounting (وش سويت) — مع أمثلة الدكتور.", "Local AAA للشبكات الصغيرة · Server-based AAA (RADIUS / TACACS+) للشبكات الكبيرة.", "<b>TACACS+</b>: TCP 49 · يشفّر كل الباكيت · يفصل المصادقة عن التفويض. <b>RADIUS</b>: UDP · يشفّر كلمة المرور فقط · يدمجهم · مناسب لفوترة ISP."], "chapters": [{"t": 0.0, "title": "أمن بروتوكولات التوجيه"}, {"t": 51.8, "title": "مصادقة OSPF"}, {"t": 78.3, "title": "Syslog ومستويات الخطورة"}, {"t": 134.2, "title": "مزامنة الوقت NTP"}, {"t": 157.1, "title": "إدارة الشبكة SNMP"}, {"t": 200.5, "title": "Triple A"}, {"t": 231.8, "title": "أنواع المصادقة"}, {"t": 256.1, "title": "TACACS+ ضد RADIUS"}], "dur": 288, "v": 4}, {"slug": "ns5", "title": "Lecture 5 — Access Control Lists (ACL)", "icon": "🚦", "ic": "acl", "bg": "var(--cor)", "lec": "NS-Lecture 5", "ideaTitle": "أهم النقاط للاختبار", "idea": ["<b>ACL</b> = أوامر permit/deny تفلتر الباكيتات حسب الهيدر · كل سطر اسمه <b>ACE</b> · الراوتر افتراضياً بدون ACL.", "<b>Standard</b>: Source IP فقط (L3) · الأرقام 1–99 و 1300–1999.", "<b>Extended</b>: Source + Destination + Protocol + Ports (L3 + L4) · الأرقام 100–199 و 2000–2699 · operators: eq · gt · lt · neq.", "Inbound قبل التوجيه (أكفأ) · Outbound بعد التوجيه.", "الخطوات: يطلع الـ Source ← يقارن من فوق لتحت ← أول تطابق ينفّذ ويوقف ← ما فيه تطابق = <b>implicit deny</b>.", "<b>Wildcard</b>: 0 = match · 1 = ignore · حيلة: 255.255.255.255 − subnet mask (host = 0.0.0.0 · /24 = 0.0.0.255 · 16–31 = 0.0.15.255).", "<code dir='ltr'>access-list 100 permit tcp 192.168.1.0 0.0.0.255 172.16.0.0 0.0.0.255 eq 80</code>", "<b>established</b>: يسمح بالردود فقط على اتصالات بدأت من الداخل (stateful بسيط)."], "chapters": [{"t": 0.0, "title": "وش هي الـ ACL؟"}, {"t": 37.7, "title": "القياسية والممتدة"}, {"t": 67.1, "title": "طريقة عمل الـ ACL"}, {"t": 99.5, "title": "الـ wildcard mask"}, {"t": 133.6, "title": "أمثلة الـ wildcard"}, {"t": 162.2, "title": "كتابة الأوامر"}, {"t": 200.3, "title": "TCP established"}], "dur": 220, "v": 4}, {"slug": "ns6", "title": "Lecture 6 — Fundamentals of Firewalls", "icon": "🧱", "ic": "wall", "bg": "var(--yel)", "lec": "NS-Lecture 6", "ideaTitle": "أهم النقاط للاختبار", "idea": ["الجدار الناري = حاجز بين العالم وشبكتك · الأنواع: Packet filter · Stateful · Circuit gateway (Network-level) · Application gateway (Application-level).", "<b>Packet filter</b> (screening host / <b>stateless</b>): يشوف الهيدر فقط (IPs · ports · protocol) · بدون مصادقة · معرض لـ SYN / Ping flood.", "<b>Stateful</b> (dynamic packet filter): <b>state table</b> · يعرف إذا الباكيت جزء من اتصال · أأمن ومنصوح فيه.", "<b>Application gateway</b> (application proxy): طبقة التطبيق · يتحقق من <b>تطبيق العميل ثم المستخدم</b> · يفحص البيانات · عيوبه: بوابة لكل بروتوكول، موارد وتأخير أكثر.", "<b>Circuit-level gateway</b>: أقل أمان · يتحقق من <b>المستخدم أولاً</b> · طبقة النقل/الجلسة (L4–5) · يكمل TCP handshake ويمرر البيانات بدون فحص · يخفي الـ IP الداخلي · <b>SOCKS = TCP 1080</b>.", "حدود الجدار الناري: ما يمنع الهجمات الداخلية · ينتجاوز بالأنفاق · حماية ضعيفة ضد الفيروسات داخل البيانات · إحساس كاذب بالأمان."], "chapters": [{"t": 0.0, "title": "وش هو الجدار الناري؟"}, {"t": 28.2, "title": "فلترة الباكيتات بدون حالة"}, {"t": 58.2, "title": "الفلترة ذات الحالة"}, {"t": 81.1, "title": "بوابة التطبيق"}, {"t": 116.5, "title": "بوابة الدائرة"}, {"t": 150.1, "title": "المقارنة والخلاصة"}], "dur": 195, "v": 4}], "quiz": [{"title": "Tasks 3 - 4", "note": "بعض أسئلة Tasks 3-4 من محاضرة 3 (حماية الراوتر)، وأغلبها من محاضرة 4", "items": [{"t": "mcq", "q": "The edge router is:", "o": ["The first router inside the LAN", "The last router between the internal network and an untrusted network", "A router used only for wireless networks", "A backup router"], "a": 1, "ar": "الـ Edge router هو آخر راوتر بين شبكتك الداخلية والشبكة غير الموثوقة (الإنترنت)، يعني على الحافة.", "lec": "L3"}, {"t": "mcq", "q": "In a defense-in-depth approach, the first line of defense is:", "o": ["Firewall", "Internal router", "Edge router", "Switch"], "a": 2, "ar": "في الدفاع بالعمق، أول خط دفاع هو الـ Edge router، وبعده الجدار الناري، وبعده الراوتر الداخلي.", "lec": "L3"}, {"t": "mcq", "q": "Which protocol should be used instead of Telnet for secure remote access?", "o": ["FTP", "HTTP", "SSH", "SNMP"], "a": 2, "ar": "Telnet يرسل كل شي نص واضح بدون تشفير، وبديله الآمن SSH لأنه مشفّر.", "lec": "L3"}, {"t": "mcq", "q": "The DMZ is mainly used to:", "o": ["Store backups", "Isolate public servers from the internal LAN", "Replace the firewall", "Increase bandwidth"], "a": 1, "ar": "الـ DMZ منطقة معزولة نحط فيها السيرفرات العامة (ويب، إيميل) عشان لو انخترقت ما توصل للشبكة الداخلية.", "lec": "L3"}, {"t": "mcq", "q": "Routing protocol spoofing attempts to:", "o": ["Increase bandwidth", "Manipulate routing tables using fake updates", "Encrypt routing traffic", "Improve routing speed"], "a": 1, "ar": "تزوير بروتوكول التوجيه = يرسل تحديثات توجيه مزيفة عشان يتلاعب بجدول التوجيه ويحوّل الترافيك.", "lec": "L4"}, {"t": "mcq", "q": "The main purpose of Syslog is to:", "o": ["Encrypt network traffic", "Monitor routing tables", "Collect and store system messages", "Assign IP addresses"], "a": 2, "ar": "Syslog يجمع رسائل النظام من الأجهزة ويرسلها لسيرفر Syslog على UDP 514.", "lec": "L4"}, {"t": "mcq", "q": "Which syslog level is the most critical?", "o": ["Level 7", "Level 4", "Level 0", "Level 6"], "a": 2, "ar": "كل ما صغر الرقم كان أخطر، فـ Level 0 (Emergency) هو الأخطر، و Level 7 (Debugging) الأقل.", "lec": "L4"}, {"t": "mcq", "q": "OSPF authentication is done more securely using ?", "o": ["MD5", "SHA", "SMTP", "None of these"], "a": 1, "ar": "MD5 صار ضعيف، والدكتور يقول استخدم SHA لأنه أقوى ما دام الراوترات تدعمه.", "lec": "L4"}, {"t": "mcq", "q": "The three main components of SNMP are:", "o": ["Router, Switch, Firewall", "Manager, Agent, MIB", "Client, Server, DNS", "TCP, UDP, IP"], "a": 1, "ar": "مكونات SNMP الثلاثة: Manager (برنامج الإدارة) و Agent (على الجهاز) و MIB (قاعدة البيانات).", "lec": "L4"}, {"t": "mcq", "q": "TACACS+ differs from RADIUS because TACACS+:", "o": ["Uses UDP", "Encrypts only passwords", "Separates authentication and authorization", "Uses port 514"], "a": 2, "ar": "TACACS+ يفصل المصادقة عن التفويض، ويشفّر كل الباكيت، ويستخدم TCP 49. الخيارات الثانية هي صفات RADIUS أو Syslog.", "lec": "L4"}, {"t": "tf", "q": "The firewall denies incoming connections from untrusted networks by default.", "a": true, "ar": "صح، الجدار الناري افتراضياً يرفض الاتصالات الداخلة من الشبكات غير الموثوقة ويسمح بالردود فقط.", "lec": "L3"}, {"t": "tf", "q": "Local access to a router usually requires a console cable.", "a": true, "ar": "صح، الوصول المحلي للراوتر يكون بكيبل الكونسول.", "lec": "L3"}, {"t": "tf", "q": "Telnet encrypts all transmitted data.", "a": false, "ar": "خطأ، Telnet ما يشفّر شي، كل البيانات حتى كلمة المرور تمشي نص واضح.", "lec": "L3"}, {"t": "tf", "q": "SNMP protocol is used to synchronize the timing within the network", "a": false, "ar": "خطأ، مزامنة الوقت شغل NTP (UDP 123). أما SNMP فهو لإدارة ومراقبة الأجهزة.", "lec": "L4"}, {"t": "tf", "q": "Smaller syslog severity numbers indicate less critical events.", "a": false, "ar": "خطأ، بالعكس: الرقم الأصغر = أخطر (0 Emergency).", "lec": "L4"}, {"t": "tf", "q": "NTP ensures synchronized time across network devices.", "a": true, "ar": "صح، NTP يزامن وقت الأجهزة مع سيرفر وقت موثوق.", "lec": "L4"}, {"t": "tf", "q": "Router hardening includes disabling unused ports and services.", "a": true, "ar": "صح، تقوية الراوتر تشمل إيقاف المنافذ والخدمات غير المستخدمة.", "lec": "L3"}, {"t": "tf", "q": "RADIUS encrypts the entire packet during transmission.", "a": false, "ar": "خطأ، RADIUS يشفّر كلمة المرور فقط، واللي يشفّر الباكيت كامل هو TACACS+.", "lec": "L4"}, {"t": "tf", "q": "AAA stands for Authentication, Authorization, and Accounting.", "a": true, "ar": "صح، AAA = المصادقة والتفويض والمحاسبة.", "lec": "L4"}, {"t": "tf", "q": "Defense-in-depth uses multiple security layers.", "a": true, "ar": "صح، الدفاع بالعمق يعتمد على عدة طبقات حماية بدل طبقة وحدة.", "lec": "L3"}, {"t": "essay", "q": "Explain the defense-in-depth security approach. Describe its components and why it is more secure than the single router approach.", "model": ["Defense-in-depth is more secure than the single router approach because it uses <b>multiple layers of security</b> before traffic enters the protected LAN.", "Three primary layers: the <b>edge router</b> (first line of defense, known as a <b>screening router</b>, does initial filtering) → the <b>firewall</b> (second line: additional filtering, tracks the state of connections, checkpoint device; by default denies connections initiated from the outside) → the <b>internal router</b> that connects to the protected LAN.", "Other tools can be added: IPS, web security appliances (proxy), email security appliances (spam filtering); a DMZ variation can host public servers.", "Single router approach: all security policies on one device (small offices/SOHO) — if it fails, nothing else protects the LAN."], "ar": "اكتب الطبقات الثلاث بالترتيب مثل الدكتور: Edge router (screening router) ثم Firewall (يتتبع الحالة ويرفض الاتصالات من برا افتراضياً) ثم Internal router. لو المهاجم عدّى طبقة تصدّه اللي بعدها، عكس الراوتر الواحد.", "lec": "L3"}, {"t": "essay", "q": "Discuss the importance of securing remote access to routers. Include risks of plaintext protocols and recommended security practices.", "model": ["Routers can be accessed locally (console cable to the console port) or remotely (Telnet, SSH, HTTP, HTTPS, SNMP).", "Risk: some remote access protocols (e.g. <b>Telnet, HTTP</b>) send usernames and passwords in <b>plaintext</b> — an attacker capturing traffic can steal passwords or configuration.", "It is preferable to allow only local access; if remote access is needed:", "• Encrypt all traffic — use <b>SSH version 2</b> instead of Telnet, <b>HTTPS</b> instead of HTTP.", "• Use a <b>dedicated management network</b> with only identified admin hosts.", "• Configure a <b>packet filter</b> (ACL) to allow only admin hosts and preferred protocols (e.g. only SSH from the admin IP).", "• Establish a <b>VPN</b> connection before connecting to the router management interface."], "ar": "الوصول عن بعد خطير لو كان بـ Telnet أو HTTP لأن كلمة المرور تمشي نص واضح. اكتب احتياطات الدكتور الأربعة: تشفير (SSH v2 و HTTPS)، شبكة إدارة مخصصة، Packet filter يسمح للأدمن بس، و VPN.", "lec": "L3"}, {"t": "essay", "q": "Explain how SNMP works. Describe the roles of the SNMP manager, agent, and MIB.", "model": ["SNMP is an application-layer protocol used to monitor and manage network devices.", "<b>Manager</b>: runs management software; uses <b>get</b> to read and <b>set</b> to change configuration; polls agents on <b>UDP 161</b>.", "<b>Agent</b>: software on the managed device; answers requests and sends <b>traps</b> to the manager on <b>UDP 162</b>.", "<b>MIB</b>: database on the device that stores its data and operational statistics.", "SNMPv3 adds authentication, encryption and integrity."], "ar": "المانجر يسأل (get) ويعدّل (set)، والإيجنت على الجهاز يرد ويرسل تنبيهات (trap)، والـ MIB هي اللي فيها بيانات الجهاز. احفظ المنافذ 161 و 162، وإن v3 هو الآمن.", "lec": "L4"}, {"t": "essay", "q": "Discuss the AAA framework. Explain authentication, authorization, and accounting with examples.", "model": ["<b>Authentication</b>: prove identity — e.g., “I am user ‘student’ and I know the password.”", "<b>Authorization</b>: what the user can access/do — e.g., “student can access serverXYZ using SSH only.”", "<b>Accounting</b>: record what the user did — e.g., “student accessed serverXYZ via SSH for 15 minutes.” Used for auditing/billing.", "Modes: <b>Local AAA</b> (small networks) or <b>Server-based AAA</b> using RADIUS / TACACS+ (many devices, central management)."], "ar": "اكتب الثلاث مع أمثلة الدكتور نفسها، وأضف نوعين المصادقة: محلية للشبكات الصغيرة، وسيرفر مركزي (RADIUS / TACACS+) للشبكات الكبيرة.", "lec": "L4"}, {"t": "essay", "q": "Compare TACACS+ and RADIUS in terms of encryption, ports used, and functionality.", "model": ["<b>Encryption</b>: TACACS+ encrypts the entire communication; RADIUS encrypts the password only.", "<b>Ports</b>: TACACS+ uses TCP port 49; RADIUS uses UDP.", "<b>Functionality</b>: TACACS+ separates authentication and authorization (per-user/per-group policies); RADIUS combines them and supports detailed accounting (ISP billing), 802.1X and SIP."], "ar": "جدول المقارنة: التشفير (كامل ضد كلمة المرور)، المنفذ (TCP 49 ضد UDP)، الوظيفة (يفصل ضد يدمج). اكتبه كجدول في الاختبار.", "lec": "L4"}]}, {"title": "Tasks 5 - 6", "note": "أسئلة محاضرة 5 (ACL) ومحاضرة 6 (Firewalls)", "items": [{"t": "mcq", "q": "What is the main purpose of an ACL?", "o": ["Encrypt data", "Filter packets based on rules", "Increase bandwidth", "Store data"], "a": 1, "ar": "الـ ACL مجموعة قواعد (permit/deny) تفلتر الباكيتات حسب معلومات الهيدر.", "lec": "L5"}, {"t": "mcq", "q": "Standard ACLs filter traffic based on:", "o": ["Destination IP", "Source IP only", "Port numbers", "Protocol type"], "a": 1, "ar": "القياسية تفلتر بعنوان المصدر فقط (Layer 3).", "lec": "L5"}, {"t": "mcq", "q": "Extended ACLs can filter based on:", "o": ["Only source IP", "Only destination IP", "Source, destination, ports, and protocol", "MAC address"], "a": 2, "ar": "الممتدة تفلتر بالمصدر والوجهة والبورتات ونوع البروتوكول (Layer 3 + 4).", "lec": "L5"}, {"t": "mcq", "q": "Circuit-Level gateway works at which layer(s) _____________ ?", "o": ["Layer 1 & 2", "Layer 4 & 5", "Layer 5 & 6", "Layer 7"], "a": 1, "ar": "بوابة الدائرة بروكسي لـ TCP/UDP في طبقة النقل والجلسة، يعني Layer 4 و 5.", "lec": "L6"}, {"t": "mcq", "q": "What does a wildcard mask bit “0” mean?", "o": ["Ignore bit", "Match bit", "Block packet", "Encrypt data"], "a": 1, "ar": "في الوايلد كارد: 0 = طابق البت، 1 = تجاهله (عكس السبنت ماسك).", "lec": "L5"}, {"t": "mcq", "q": "What happens if no ACL rule matches a packet?", "o": ["It is allowed", "It is encrypted", "It is denied (implicit deny)", "It is delayed"], "a": 2, "ar": "في آخر كل ACL فيه منع ضمني (implicit deny)، فالباكيت اللي ما تطابق شي تنرمى.", "lec": "L5"}, {"t": "mcq", "q": "A packet filtering firewall is also called:", "o": ["Stateful firewall", "Application gateway", "Stateless firewall", "Proxy server"], "a": 2, "ar": "فلتر الباكيتات ما يحفظ حالة الاتصالات، فاسمه Stateless firewall (ويسمى screening host).", "lec": "L6"}, {"t": "mcq", "q": "Stateful firewalls:", "o": ["Do not track connections", "Track connection states", "Only check IP address", "Ignore packets"], "a": 1, "ar": "ذو الحالة يتتبع حالة الاتصالات بجدول state table.", "lec": "L6"}, {"t": "mcq", "q": "Application gateways operate at which layer?", "o": ["Network layer", "Transport layer", "Application layer", "Data link layer"], "a": 2, "ar": "بوابة التطبيق (application proxy) تشتغل في طبقة التطبيق.", "lec": "L6"}, {"t": "mcq", "q": "Circuit-level gateways mainly work at:", "o": ["Application layer", "Session/Transport layer", "Physical layer", "Data link layer"], "a": 1, "ar": "بوابة الدائرة في طبقة الجلسة/النقل.", "lec": "L6"}, {"t": "tf", "q": "ACLs are evaluated from top to bottom.", "a": true, "ar": "صح، الراوتر يقارن الأسطر بالترتيب من فوق لتحت ويوقف عند أول تطابق.", "lec": "L5"}, {"t": "tf", "q": "Routers use ACLs to control traffic flow.", "a": true, "ar": "صح، من استخدامات الـ ACL التحكم بتدفق الترافيك.", "lec": "L5"}, {"t": "tf", "q": "Extended ACLs cannot filter by port numbers.", "a": false, "ar": "خطأ، الممتدة تقدر تفلتر بالبورتات (eq, gt, lt, neq).", "lec": "L5"}, {"t": "tf", "q": "Packet filtering examines packet data and packet streaming", "a": false, "ar": "خطأ، فلتر الباكيتات يشوف الهيدر بس، وما يشوف البيانات ولا يتتبع الـ stream.", "lec": "L6"}, {"t": "tf", "q": "In wildcard masks, 1 means ignore the bit.", "a": true, "ar": "صح، 1 = تجاهل، 0 = طابق.", "lec": "L5"}, {"t": "tf", "q": "Stateful firewalls are more secure than stateless firewalls.", "a": true, "ar": "صح، لأنه فاهم سياق الاتصال وأقل عرضة لهجمات الإغراق.", "lec": "L6"}, {"t": "tf", "q": "Packet filtering firewalls track connection states.", "a": false, "ar": "خطأ، هذا شغل الـ Stateful. فلتر الباكيتات Stateless.", "lec": "L6"}, {"t": "tf", "q": "Application gateways require authentication.", "a": true, "ar": "صح، يتحقق من تطبيق العميل أولاً وبعدين من المستخدم.", "lec": "L6"}, {"t": "tf", "q": "Circuit-level gateways inspect application data deeply.", "a": false, "ar": "خطأ، بوابة الدائرة ما تتدخل في البيانات، تمرر الـ stream بس. اللي يفحص بعمق هي بوابة التطبيق.", "lec": "L6"}, {"t": "tf", "q": "Firewalls can completely prevent all attacks.", "a": false, "ar": "خطأ، من حدود الجدار الناري: ما يحمي من الهجمات الداخلية ولا من البرمجيات الخبيثة داخل البيانات، ويعطي إحساس كاذب بالأمان.", "lec": "L6"}, {"t": "essay", "q": "Explain how ACLs work in routers and describe the packet filtering process step-by-step.", "model": ["An ACL is a sequential list of permit/deny statements (ACEs) applied to an interface (inbound or outbound).", "1. The router extracts the source IPv4 address from the packet header.", "2. It compares it with each ACE from the top, in sequential order.", "3. On the first match it permits or denies the packet; remaining ACEs are not checked.", "4. If nothing matches, the packet is discarded by the <b>implicit deny</b>.", "Inbound ACL filters before routing (efficient); outbound after routing."], "ar": "اكتب الخطوات الأربع بالترتيب مثل شريحة الدكتور، ولا تنسى الـ implicit deny والفرق بين inbound و outbound.", "lec": "L5"}, {"t": "essay", "q": "Compare Standard ACLs vs Extended ACLs in terms of functionality and use cases.", "model": ["<b>Standard</b>: filters by source IPv4 only (Layer 3); numbers 1–99, 1300–1999; e.g. <code>access-list 10 permit 192.168.1.0 0.0.0.255</code>. Simple network-wide permit/deny.", "<b>Extended</b>: filters by source and/or destination IP, protocol (ip/tcp/udp/icmp), and TCP/UDP ports (Layer 3 & 4); numbers 100–199, 2000–2699; e.g. <code>access-list 100 permit tcp 192.168.1.0 0.0.0.255 172.16.0.0 0.0.0.255 eq 80</code>. Finer control (allow only HTTP, block ping…), and the <code>established</code> keyword."], "ar": "قارن في جدول: على وش تفلتر، الطبقة، الأرقام، ومثال أمر لكل وحدة من المحاضرة.", "lec": "L5"}, {"t": "essay", "q": "Discuss the differences between stateless and stateful firewalls, including advantages and limitations.", "model": ["<b>Stateless (packet filter / screening host)</b>: checks each packet's header (src/dst IP, ports, protocol) alone; fast and simple. Limitations: no tracking, no authentication, header only, vulnerable to SYN/Ping floods.", "<b>Stateful (dynamic packet filter)</b>: keeps a connection state table, knows if a packet belongs to an existing stream; less susceptible to flood attacks and more secure — recommended when possible. Limitation: needs more resources/processing."], "ar": "الفرق الجوهري: الـ Stateless يحكم على كل باكيت لحالها من الهيدر، والـ Stateful يتذكر الاتصالات بجدول حالات. اذكر العيوب من شريحة الدكتور.", "lec": "L6"}, {"t": "essay", "q": "Explain the working principle of an application gateway and how it improves network security.", "model": ["An application gateway (application proxy) is a program running on the firewall at the application layer.", "It examines the connection between client and server applications; the admin specifies which applications are allowed.", "The client application is authenticated first, then the user (info stored locally or on RADIUS/TACACS+).", "Security: deep inspection of application data, hides internal hosts (only the proxy is seen), computers behind it are protected.", "Cost: each protocol needs its own gateway, more resources, more latency."], "ar": "بوابة التطبيق وسيط بين العميل والسيرفر، تتحقق من التطبيق ثم المستخدم، وتفحص البيانات بعمق وتخفي الأجهزة الداخلية. اذكر العيوب كخاتمة.", "lec": "L6"}, {"t": "essay", "q": "Compare Application Gateway vs Circuit-Level Gateway in terms of: Security level · Performance · Layer of operation", "model": ["<b>Security level</b>: Application gateway is higher (inspects application data, authenticates client app then user); circuit-level gateway is lower (authenticates the user only, does not inspect data).", "<b>Performance</b>: application gateway is slower (more resources, latency, one proxy per protocol); circuit-level gateway is faster (just relays the TCP/UDP stream).", "<b>Layer</b>: application gateway — Application layer (7); circuit-level gateway — Transport/Session layer (4–5), e.g. SOCKS on TCP 1080."], "ar": "ثلاث نقاط بالضبط مثل السؤال: الأمان (التطبيق أعلى)، الأداء (الدائرة أسرع)، الطبقة (7 ضد 4-5).", "lec": "L6"}]}]}, {"slug": "assembly", "ic": "code", "bg": "var(--min)", "title": "لغة التجميع", "icon": "💻", "code": "COE224", "color": "#AEDDC4", "sub": "ميدتير e dir='ltr'>10*10</code> تتحسب، و <code dir='ltr'>&lt;10*10&gt;</code> تبقى نص.", "<b>TEXTEQU</b>: رقم أو نص · اسمها <b>text macro</b> · تقبل إعادة التعريف · <code dir='ltr'>%( )</code> تحسب التعبير.", "64-bit: ممنوع INVOKE · ADDR · .model · .386 · .stack — ونستخدم CALL بدون arguments."], "chapters": [{"t": 0.0, "title": "علامة يساوي"}, {"t": 26.5, "title": "حساب حجم المصفوفة"}, {"t": 52.9, "title": "EQU"}, {"t": 69.8, "title": "TEXTEQU"}, {"t": 102.7, "title": "البرمجة بأربعة وستين bit"}], "dur": 119, "v": 4}, {"slug": "as6", "title": "Lecture 6 — Data Transfers & Arithmetic", "icon": "🔁", "ic": "cpu", "bg": "var(--pea)", "lec": "Lec6 · Chapter 4", "ideaTitle": "أهم النقاط للاختبار", "idea": ["المعاملات: Immediate · Register · Memory.", "قواعد <b>MOV</b>: نفس الحجم · ممنوع memory ← memory · CS/EIP/IP ما تكون وجهة · ممنوع immediate ← segment register · الرقم ما يكون وجهة.", "<b>MOVZX</b> يعبّي أصفار · <b>MOVSX</b> ينسخ بت الإشارة · الوجهة register والمصدر مو immediate.", "<b>XCHG</b> يبدّل · واحد على الأقل register · Direct-offset بالبايت: WORD +2 · DWORD +4.", "<b>INC</b> +1 · <b>DEC</b> −1 · <b>ADD/SUB</b> نفس قواعد MOV · <b>NEG</b> = Two's complement (SUB 0,operand).", "الفلاقات: <b>ZF</b> الناتج صفر · <b>SF</b> الناتج سالب · <b>CF</b> unsigned برا المدى · <b>OF</b> signed برا المدى · MOV ما يغيّر الفلاقات.", "OF = 1 فقط لما: موجب + موجب = سالب، أو سالب + سالب = موجب."], "chapters": [{"t": 0.0, "title": "أنواع المعاملات"}, {"t": 19.7, "title": "قواعد MOV"}, {"t": 64.5, "title": "MOVZX وMOVSX"}, {"t": 81.3, "title": "XCHG والإزاحة"}, {"t": 103.4, "title": "INC و DEC و ADD و SUB"}, {"t": 132.5, "title": "حل سؤال الميد السابق"}, {"t": 175.3, "title": "الـ flags"}, {"t": 204.5, "title": "الـ overflow"}], "dur": 236, "v": 4}], "quiz": [{"title": "Previous Midterm 2 (472) — Official Answers", "note": "اختبار الميدترم 2 من الترم السابق مع إجابات الدكتور الرسمية — الدكتور قال استعينوا فيه", "essayLabel": "Questions 2 & 3 — Written", "items": [{"t": "tf", "q": "TEXTEQU di  tag:`<svg viewBox="0 0 64 64" fill="none" stroke="#16182B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M8 30V10h20l28 28-20 20z" fill="#fff"/><circle cx="19" cy="21" r="4" fill="#F5C84C"/><path d="M30 34l8 8M34 30l8 8" stroke="#7077E0"/></svg>`,

 plus:`<svg viewBox="0 0 64 64" fill="none" stroke="#16182B" stroke-width="2.6" stroke-linecap="round"><circle cx="32" cy="32" r="20" fill="#fff"/><path d="M32 22v20M22 32h20"/></svg>`
};
const BG = ["var(--lav)", "var(--cor)", "var(--yel)", "var(--min)", "var(--pea)", "var(--sky)"];
function bd(s) {
  return s.replace(/[^؀-ۿ،؛]+/g, m => {
    if (!/[0-9A-Za-zΩπω√]/.test(m)) return m;
    let pre = "", post = "", core = m;
    const lead = core.match(/^[\s):·،.]+/); if (lead) { pre = lead[0]; core = core.slice(pre.length); }
    const tail = core.match(/[\s(:·،]+$/); if (tail) { post = tail[0]; core = core.slice(0, -post.length); }
    const o = (core.match(/\(/g) || []).length, c = (core.match(/\)/g) || []).length;
    if (c > o && core.endsWith(")")) { core = core.slice(0, -1); post = ")" + post; }
    return pre + `<bdi dir="ltr">${core}</bdi>` + post;
  });
}
const fmt = t => { t = Math.round(t); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
const strip = h => h.replace(/<[^>]+>/g, "");
const crumbs = (...xs) => `<div class="crumbs"><a href="#/">الرئيسية</a>${xs.map(x => ` ‹ ${x}`).join("")}</div>`;
const by = meta => `<div class="by"><span class="av">MA</span><span class="en">Murad Alzaaq</span><span class="meta">${meta}</span></div>`;
function setNav(k) { document.querySelectorAll("#nav a[data-n]").forEach(a => a.classList.toggle("on", a.dataset.n === k)); }

function topicCard(S, t, i) {
  return `<a class="card" href="#/${S.slug}/${t.slug}">
    <div class="thumb" style="background:${t.bg || BG[i % 6]}">${IC[t.ic] || IC.shield}<span class="tag">${t.lec}</span>${t.dur ? `<span class="dur">▶ ${fmt(t.dur)}</span>` : ""}</div>
    <div class="cb"><h3>${t.title}</h3><p>${strip(t.idea[0])}</p>${by(t.dur ? `<span class="pill ac">فيديو + شرح</span>` : `<span class="pill">شرح مكتوب</span>`)}</div></a>`;
}
function quizCard(S) {
  const n = S.quiz.reduce((a, q) => a + q.items.length, 0);
  return `<a class="card" href="#/${S.slug}/quiz"><div class="thumb" style="background:var(--min)">${IC.quiz}<span class="tag">Question Bank</span></div>
    <div class="cb"><h3>اختبر نفسك — بنك الأسئلة</h3><p>${S.quizSub || S.quiz.map(q => q.title).join(" · ") + " — الأسئلة بالإنجليزي مثل ما هي، مع شرح عربي لكل إجابة"}</p>${by(`<span class="pill ac">${n} سؤال</span>`)}</div></a>`;
}

function home() {
  setNav("home"); document.title = "منصة الشروحات — Murad Alzaaq";
  app.innerHTML = `
  <section class="hero"><h1>تعلّم موادك <em>بالصوت والصورة</em></h1>
  <p>شروحات مختصرة بنفس محاضرات الدكتور، أمثلة محلولة، واختبارات تدريب بشرح عربي.</p>
  <form class="search" id="sf"><input id="q" placeholder="ابحث عن شرح… مثلاً ACL أو Thevenin" autocomplete="off"><button aria-label="بحث"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button></form></section>
  <div id="results"></div>
  <h2 class="sec">المواد</h2>
  <div class="grid">
    ${SUBJ.map((S, i) => `<a class="card" href="#/${S.slug}"><div class="thumb" style="background:${S.bg}">${IC[S.ic]}<span class="tag">${S.code}</span></div>
      <div class="cb"><h3>${S.title}</h3><p>${S.sub}</p>${by(`<span class="pill">${S.topics.length} مواضيع</span>${S.quiz ? `<span class="pill ac">اختبار</span>` : ""}`)}</div></a>`).join("")}
    <a class="card" href="${PYLAB}" target="_blank" rel="noopener"><div class="thumb" style="background:var(--sky)">${IC.code}<span class="tag">Python</span></div>
      <div class="cb"><h3>مختبر بايثون</h3><p>40 درس من الأساسيات إلى الأمن السيبراني مع تشغيل حقيقي للكود</p>${by(`<span class="pill">↗ يفتح المختبر</span>`)}</div></a>
    <div class="card soon"><div class="thumb" style="background:#EEEEF4">${IC.plus}</div><div class="cb"><h3>مواد جاية</h3><p>تنضاف مواد ثانية قريباً</p></div></div>
  </div>`;
  const all = SUBJ.flatMap(S => S.topics.map((t, i) => ({ S, t, i })));
  const run = () => {
    const v = $("#q").value.trim().toLowerCase(), r = $("#results");
    if (!v) { r.innerHTML = ""; return; }
    const hits = all.filter(({ t }) => (t.title + " " + t.lec + " " + strip(t.idea.join(" "))).toLowerCase().includes(v));
    r.innerHTML = `<h2 class="sec">نتائج البحث</h2>${hits.length ? `<div class="grid">${hits.map(({ S, t, i }) => topicCard(S, t, i)).join("")}</div>` : `<div class="empty">ما لقيت شرح بهالاسم</div>`}`;
  };
  $("#q").oninput = run; $("#sf").onsubmit = e => { e.preventDefault(); run(); };
}

function subject(S) {
  setNav(S.slug); document.title = S.title + " — منصة الشروحات";
  app.innerHTML = `${crumbs(`<span>${S.title}</span>`)}
  <div class="pagehead"><span class="ph" style="background:${S.bg}">${IC[S.ic]}</span><div><h1>${S.title} <span class="en" style="color:var(--mut);font-size:.6em">${S.code}</span></h1><p>${S.intro}</p></div></div>
  ${S.banner ? `<div class="panel banner"><span class="bi">📢</span><div>${S.banner}</div></div>` : ""}
  <h2 class="sec">${S.quiz ? "الشروحات" : "المواضيع"}</h2>
  <div class="grid">${S.topics.map((t, i) => topicCard(S, t, i)).join("")}${S.quiz ? quizCard(S) : ""}</div>`;
}

function topic(S, t) {
  setNav(S.slug); document.title = t.title + " — منصة الشروحات";
  const ex = t.example, i = S.topics.indexOf(t);
  app.innerHTML = `${crumbs(`<a href="#/${S.slug}">${S.title}</a>`, `<span>${t.title}</span>`)}
  <div class="pagehead"><span class="ph" style="background:${t.bg || BG[i % 6]}">${IC[t.ic] || IC.shield}</span><div><h1>${t.title}</h1><p class="en" dir="ltr" style="text-align:right">${t.lec}</p></div></div>
  ${t.dur ? `<div class="tp">
    <div class="player"><video id="vid" controls playsinline preload="metadata" src="video/${t.slug}.mp4${t.v ? "?v=" + t.v : ""}"></video></div>
    <div class="chap"><h4>فصول الفيديو</h4>${t.chapters.map((c, k) => `<button data-t="${c.t}"><span class="n">${k + 1}</span><span>${c.title}</span><span class="tm">${fmt(c.t)}</span></button>`).join("")}</div>
  </div>` : `<div class="panel" style="text-align:center;padding:36px 20px;margin-top:0"><div style="font-size:40px">🎬</div><h3 style="justify-content:center">الفيديو المشروح قيد التجهيز</h3><p style="color:var(--mut)">الشرح المكتوب جاهز تحت 👇</p></div>`}
  <div class="panel"><h3>📌 ${t.ideaTitle || "الفكرة والقواعد"}</h3><ul>${t.idea.map(x => `<li>${x}</li>`).join("")}</ul><div class="src">المصدر: ${t.lec}</div></div>
  ${ex ? `<div class="two">
    <div class="panel"><h3>✍️ ${ex.title}</h3>${ex.given ? `<div class="given">${bd(ex.given)}</div>` : ""}<ol class="steps">${ex.steps.map(s => `<li>${bd(s)}</li>`).join("")}</ol></div>
    ${ex.extra ? `<div class="panel"><h3>✍️ ${ex.extra.title}</h3><ol class="steps">${ex.extra.steps.map(s => `<li>${bd(s)}</li>`).join("")}</ol></div>` : ""}
  </div>` : ""}
  ${t.grade ? `<div class="two">
    <div class="panel"><h3>🎯 توزيع الدرجات (متوقع)</h3><table class="gt">${t.grade.map(g => `<tr><td>${g[0]}</td><td>${g[1]}</td></tr>`).join("")}<tfoot><tr><td>المجموع</td><td>${t.grade.reduce((a, g) => a + g[1], 0)}</td></tr></tfoot></table></div>
    <div class="panel"><h3>🧪 سؤال تدريب</h3><div class="q">${bd(t.practice.q)}</div><button class="btn" id="rv">اعرض الحل</button>
      <div class="ans" id="ans"><ol class="steps">${t.practice.a.map(s => `<li>${bd(s)}</li>`).join("")}</ol></div></div>
  </div>` : ""}
  ${S.quiz ? `<a class="panel cta" href="#/${S.slug}/quiz"><div><b>🧪 اختبر نفسك على بنك الأسئلة</b><p>أسئلة الدكتور بالإنجليزي مع شرح عربي لكل إجابة</p></div><span class="btn">ابدأ ←</span></a>` : ""}`;
  const rv = $("#rv"); if (rv) rv.onclick = () => { const a = $("#ans"); a.classList.toggle("on"); rv.textContent = a.classList.contains("on") ? "إخفاء الحل" : "اعرض الحل"; };
  if (!t.dur) return;
  const v = $("#vid"), bs = [...document.querySelectorAll(".chap button")];
  bs.forEach(b => b.onclick = () => { v.currentTime = +b.dataset.t + 0.05; v.play(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  v.ontimeupdate = () => { let k = 0; t.chapters.forEach((c, j) => { if (v.currentTime >= c.t) k = j; }); bs.forEach((b, j) => b.classList.toggle("on", j === k)); };
}

function quiz(S) {
  setNav(S.slug); document.title = "اختبار — " + S.title;
  let n = 0;
  const lecName = l => ({ L3: "Lecture 3", L4: "Lecture 4", L5: "Lecture 5", L6: "Lecture 6" })[l] || l;
  const esc = x => x.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const head = (id, it) => `<div class="qh"><span class="qn">${id + 1}</span><span class="qt" dir="ltr">${it.q}</span><span class="lec">${lecName(it.lec)}</span></div>${it.code ? `<pre class="qcode" dir="ltr">${esc(it.code)}</pre>` : ""}`;
  const part = (q, label) => q.length ? `<h2 class="sec en">${label}</h2>${q.map(it => {
    const id = n++;
    if (it.t === "mcq") return `<div class="qc" data-a="${it.a}">${head(id, it)}
      <div class="opts" dir="ltr">${it.o.map((o, k) => `<button class="opt" data-k="${k}"><b>${"ABCD"[k]}</b>${o}</button>`).join("")}</div>
      <div class="exp"><div class="verdict"></div><div class="ar">${bd(it.ar)}</div></div></div>`;
    if (it.t === "tf") return `<div class="qc" data-a="${it.a ? 0 : 1}">${head(id, it)}
      <div class="opts tf" dir="ltr"><button class="opt" data-k="0"><b>T</b>True</button><button class="opt" data-k="1"><b>F</b>False</button></div>
      <div class="exp"><div class="verdict"></div><div class="ar">${bd(it.ar)}</div></div></div>`;
    return `<div class="qc essay">${head(id, it)}<button class="btn ghost es">اعرض نموذج الإجابة</button>
      <div class="exp"><div class="model" dir="ltr"><div class="mh">${it.label || "Model answer"}</div><ul>${it.model.map(x => `<li>${x}</li>`).join("")}</ul></div><div class="ar"><b>💡 الشرح:</b> ${bd(it.ar)}</div></div></div>`;
  }).join("")}` : "";
  const auto = S.quiz.reduce((a, Q) => a + Q.items.filter(x => x.t !== "essay").length, 0);
  app.innerHTML = `${crumbs(`<a href="#/${S.slug}">${S.title}</a>`, `<span>اختبار بنك الأسئلة</span>`)}
  <div class="pagehead"><span class="ph" style="background:var(--min)">${IC.quiz}</span><div><h1>اختبر نفسك — بنك الأسئلة</h1><p>${S.quizIntro || "أسئلة ملفات الدكتور بالإنجليزي مثل ما هي. اختر إجابتك ويطلع لك الصح مع شرح عربي."}</p></div></div>
  <div class="panel score"><span>النتيجة</span><span class="big" id="sc">0</span><span class="en" style="color:var(--mut)">/ <span id="tot">0</span> من ${auto}</span><span class="bar"><i id="bar"></i></span><button class="iconbtn" id="reset">↺ إعادة</button></div>
  ${S.quiz.map((Q, qi) => `<div class="panel qset"><span class="ph" style="background:${qi ? "var(--cor)" : "var(--lav)"}">${IC.quiz}</span><div><h3 style="margin:0" class="en">${Q.title}</h3><div class="src" style="margin:0">${Q.note}</div></div></div>
    ${part(Q.items.filter(x => x.t === "mcq"), "Part 1 — Multiple Choice")}
    ${part(Q.items.filter(x => x.t === "tf"), "Part 2 — True / False")}
    ${part(Q.items.filter(x => x.t === "essay"), Q.essayLabel || "Part 3 — Essay Questions")}`).join("")}`;
  let sc = 0, tot = 0;
  document.querySelectorAll(".qc:not(.essay)").forEach(card => {
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (card.classList.contains("done")) return;
      card.classList.add("done"); tot++;
      const ok = +b.dataset.k === +card.dataset.a; if (ok) sc++;
      b.classList.add(ok ? "right" : "wrong");
      card.querySelector(`.opt[data-k="${card.dataset.a}"]`).classList.add("right");
      card.querySelector(".verdict").innerHTML = ok ? "✅ إجابة صحيحة" : "❌ إجابة خاطئة — الصح مظلل بالأخضر";
      card.querySelector(".exp").classList.add("on");
      $("#sc").textContent = sc; $("#tot").textContent = tot; $("#bar").style.width = (100 * sc / auto) + "%";
    });
  });
  document.querySelectorAll(".es").forEach(b => b.onclick = () => { const e = b.nextElementSibling; e.classList.toggle("on"); b.textContent = e.classList.contains("on") ? "إخفاء نموذج الإجابة" : "اعرض نموذج الإجابة"; });
  $("#reset").onclick = () => quiz(S);
}

function fixBidi(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) { const n = w.currentNode; if (/[\u0600-\u06FF]/.test(n.nodeValue) && /[A-Za-z0-9]/.test(n.nodeValue) && !n.parentElement.closest("bdi,[dir=ltr],code")) nodes.push(n); }
  nodes.forEach(n => { const span = document.createElement("span"); span.innerHTML = bd(n.nodeValue.replace(/&/g, "&amp;").replace(/</g, "&lt;")); n.replaceWith(...span.childNodes); });
  root.querySelectorAll("b,code,.pill").forEach(e => { if (!/[\u0600-\u06FF]/.test(e.textContent) && /[A-Za-z0-9]/.test(e.textContent) && e.closest("[dir=rtl],body") && !e.closest("[dir=ltr]")) e.setAttribute("dir", "ltr"); });
}
function route() {
  const h = location.hash.replace(/^#\/?/, "").split("/");
  const S = SUBJ.find(x => x.slug === h[0]);
  if (!S) home();
  else if (!h[1]) subject(S);
  else if (h[1] === "quiz" && S.quiz) quiz(S);
  else { const t = S.topics.find(x => x.slug === h[1]); t ? topic(S, t) : subject(S); }
  document.querySelectorAll('.panel li,.cb p,.ar,.src,.pagehead p').forEach(fixBidi);
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route); route();

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2200); }
$("#shareBtn").onclick = async () => {
  const url = location.href;
  try { if (navigator.share) { await navigator.share({ title: document.title, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); toast("تم نسخ الرابط ✓"); } catch (e) { prompt("انسخ الرابط:", url); }
};
</script>
