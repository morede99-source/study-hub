<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة الشروحات — Murad Alzaaq</title>
<meta name="description" content="شروحات مواد بالصوت والصورة: الدوائر الكهربائية، مختبر بايثون">

<style>
:root{--bg:#0B1426;--bg2:#101D35;--card:#14233F;--line:rgba(255,255,255,.09);--tx:#EAF1FB;--mut:#9FB3CC;--ac:#FFD43B;--bl:#4DABF7;--gr:#3DDC97;--rd:#FF8A80}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;background:radial-gradient(ellipse 1400px 900px at 15% -10%,#1B3A6B 0%,var(--bg) 60%,#070D1A 100%) no-repeat,#070D1A;color:var(--tx);min-height:100vh;line-height:1.7}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(11,20,38,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;white-space:nowrap}
.brand small{font-weight:400;color:var(--mut);font-size:13px}
.logo{width:32px;height:32px}
.spacer{flex:1}
.credit{flex-shrink:0;display:flex;align-items:center;gap:12px;height:46px;padding:0 22px 0 6px;min-width:250px;border-radius:999px;background:linear-gradient(#1B2C4A,#16243D) padding-box,linear-gradient(90deg,#FFD43B,#4DABF7) border-box;border:1.5px solid transparent;white-space:nowrap;box-shadow:0 0 22px -6px rgba(77,171,247,.45)}
.credit .mono{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#13213A;background:linear-gradient(135deg,#FFD43B,#4DABF7)}
.credit .who{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.credit .who small{font-size:9.5px;font-weight:600;color:var(--mut);letter-spacing:1.6px}
.credit .who b{font-size:18px;font-weight:800;letter-spacing:.6px;background:linear-gradient(90deg,#fff 10%,#FFD43B 55%,#4DABF7);-webkit-background-clip:text;background-clip:text;color:transparent}
.share{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer}
.share:hover{background:rgba(255,255,255,.12)}
main{max-width:1180px;margin:0 auto;padding:26px 18px 60px}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:14px;margin-bottom:14px;flex-wrap:wrap}
.crumbs a{color:var(--bl)}
.hero{padding:30px 0 22px}
.hero h1{font-size:clamp(26px,4.4vw,44px);font-weight:900;line-height:1.3}
.hero h1 span{background:linear-gradient(90deg,var(--ac),var(--bl));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:17px;margin-top:8px;max-width:720px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);transition:transform .2s,border-color .2s,box-shadow .2s;cursor:pointer;overflow:hidden}
.card:hover{transform:translateY(-3px);border-color:rgba(255,212,59,.45);box-shadow:0 20px 40px -24px rgba(0,0,0,.8)}
.card .ic{font-size:34px;width:60px;height:60px;display:grid;place-items:center;border-radius:18px;background:rgba(255,255,255,.06)}
.card h3{font-size:20px;font-weight:800}
.card p{color:var(--mut);font-size:14.5px}
.card .meta{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:rgba(77,171,247,.14);color:#BFE0FF;direction:ltr}
.chip.y{background:rgba(255,212,59,.15);color:#FFE58A}.chip.g{background:rgba(61,220,151,.15);color:#A8F0CF}
.card.soon{opacity:.55;cursor:default}.card.soon:hover{transform:none;border-color:var(--line)}
.card .glow{position:absolute;inset:auto -40px -60px auto;width:160px;height:160px;border-radius:50%;filter:blur(50px);opacity:.35}
h2.sec{font-size:22px;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
h2.sec:before{content:"";width:6px;height:24px;border-radius:4px;background:linear-gradient(var(--ac),var(--bl))}
/* topic page */
.tp{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.player{border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.player video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.chap{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;max-height:520px;overflow:auto}
.chap h4{font-size:15px;color:var(--mut);padding:4px 8px 8px}
.chap button{display:flex;gap:10px;align-items:center;width:100%;text-align:right;border:0;background:none;color:var(--tx);font:inherit;font-size:14.5px;padding:9px 10px;border-radius:12px;cursor:pointer}
.chap button:hover{background:rgba(255,255,255,.06)}
.chap button.on{background:rgba(255,212,59,.13);color:#fff}
.chap .n{flex-shrink:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:rgba(255,255,255,.08);color:var(--mut)}
.chap button.on .n{background:var(--ac);color:#13213A;font-weight:800}
.chap .tm{margin-inline-start:auto;color:var(--mut);font-size:12px;direction:ltr}
.panel{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:18px}
.panel h3{font-size:19px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.panel li{padding-inline-start:22px;position:relative}
.panel li:before{content:"◆";position:absolute;inset-inline-start:0;color:var(--ac);font-size:11px;top:6px}
.panel b{color:var(--ac)}
.given{background:rgba(77,171,247,.1);border:1px dashed rgba(77,171,247,.4);border-radius:14px;padding:10px 14px;color:#CFE6FF;margin-bottom:12px;font-size:15px}
ol.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
ol.steps li{counter-increment:s;padding:10px 14px 10px 14px;padding-inline-start:46px;position:relative;border-radius:12px;background:rgba(255,255,255,.04);font-family:"DejaVu Sans","Segoe UI",sans-serif;font-size:15.5px}
ol.steps li:before{content:counter(s);position:absolute;inset-inline-start:12px;top:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--bl);color:#08101F;font-weight:800}
ol.steps li:last-child{background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.35)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.gt{width:100%;border-collapse:collapse}
.gt td{padding:10px 8px;border-bottom:1px solid var(--line)}
.gt td:last-child{text-align:left;font-weight:800;color:var(--ac);white-space:nowrap}
.gt tr:last-child td{border-bottom:0}
.gt tfoot td{border-top:2px solid var(--ac);color:#fff}
.q{font-size:16px;margin-bottom:12px}
.reveal{border:0;cursor:pointer;font:inherit;font-weight:700;padding:10px 18px;border-radius:12px;background:linear-gradient(90deg,var(--ac),#FFB938);color:#13213A}
.ans{display:none;margin-top:14px}.ans.on{display:block}
.src{font-size:13px;color:var(--mut);margin-top:10px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:30px 10px 40px;border-top:1px solid var(--line)}
footer b{color:var(--ac)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:#1B2C4A;border:1px solid var(--line);padding:10px 18px;border-radius:999px;transition:.3s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
.banner{border-color:rgba(255,212,59,.4);background:linear-gradient(160deg,rgba(255,212,59,.12),rgba(255,255,255,.02));margin:0 0 18px}
.banner b{color:var(--ac)}
.quizcard{border-color:rgba(255,138,128,.45)}
.gotoquiz{display:block;text-align:center;font-weight:800;font-size:18px;color:var(--ac)}
.score{position:sticky;top:70px;z-index:10;display:flex;align-items:center;gap:10px;font-size:18px;margin-top:0;padding:12px 18px;background:rgba(20,35,63,.92);backdrop-filter:blur(10px)}
.score b{color:var(--gr);font-size:22px}.score .share{margin-inline-start:auto}
.qset{margin-top:28px}.qset h3{margin-bottom:2px}
.qc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.qh{display:flex;gap:12px;align-items:flex-start}
.qn{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bl);color:#08101F;font-weight:800;font-size:14px}
.qt{flex:1;font-family:"Segoe UI","DejaVu Sans",sans-serif;font-size:16.5px;font-weight:600;text-align:left;line-height:1.55}
.lec{flex-shrink:0;font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(255,212,59,.14);color:#FFE58A;direction:ltr}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.opts.tf{grid-template-columns:1fr 1fr;max-width:420px}
.opt{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx);border-radius:12px;padding:11px 14px;font:15px "Segoe UI","DejaVu Sans",sans-serif;cursor:pointer;line-height:1.45}
.opt b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.1);margin-right:8px;font-size:13px}
.opt:hover{background:rgba(255,255,255,.09)}
.qc.done .opt{cursor:default}
.opt.right{background:rgba(61,220,151,.18);border-color:var(--gr)}.opt.right b{background:var(--gr);color:#08101F}
.opt.wrong{background:rgba(255,138,128,.16);border-color:var(--rd)}.opt.wrong b{background:var(--rd);color:#08101F}
.exp{display:none;margin-top:12px}.exp.on{display:block}
.verdict{font-weight:800;margin-bottom:6px}
.ar{background:rgba(77,171,247,.1);border-inline-start:4px solid var(--bl);border-radius:10px;padding:10px 14px;font-size:15.5px}
.model{background:rgba(61,220,151,.08);border:1px solid rgba(61,220,151,.3);border-radius:12px;padding:12px 16px;margin-bottom:10px;text-align:left;font-family:"Segoe UI","DejaVu Sans",sans-serif;font-size:15px}
.model .mh{font-weight:800;color:var(--gr);margin-bottom:6px}
.model ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}.model b{color:#FFE58A}
.model code{font-size:13px;background:#0B1426;padding:1px 6px;border-radius:6px;color:#7CF0B8}
.qc.essay .reveal{margin-top:12px}
@media (max-width:640px){.opts{grid-template-columns:1fr}.score{top:62px}}
@media (max-width:900px){.tp{grid-template-columns:1fr}.chap{max-height:none}.two{grid-template-columns:1fr}}
@media (max-width:640px){.brand small{display:none}.credit{min-width:0;height:40px;padding:0 12px 0 4px;gap:7px}.credit .mono{width:30px;height:30px;font-size:11px}.credit .who small{font-size:8px;letter-spacing:1px}.credit .who b{font-size:15px}.share .lbl{display:none}main{padding:16px 12px 50px}.panel{padding:16px}}
@media (max-width:440px){.brand>span{display:none}}
</style>

 "ar": "صح، الجدار الناري افتراضياً يرفض الاتصالات الداخلة من الشبكات غير الموثوقة ويسمح بالردود فقط.", "lec": "L3"}, {"t": "tf", "q": "Local access to a router usually requires a console cable.", "a": true, "ar": "صح، الوصول المحلي للراوتر يكون بكيبل الكونسول.", "lec": "L3"}, {"t": "tf", "q": "Telnet encrypts all transmitted data.", "a": false, "ar": "خطأ، Telnet ما يشفّر شي، كل البيانات حتى كلمة المرور تمشي نص واضح.", "lec": "L3"}, {"t": "tf", "q": "SNMP protocol is used to synchronize the timing within the network", "a": false, "ar": "خطأ، مزامنة الوقت شغل NTP (UDP 123). أما SNMP فهو لإدارة ومراقبة الأجهزة.", "lec": "L4"}, {"t": "tf", "q": "Smaller syslog severity numbers indicate less critical events.", "a": false, "ar": "خطأ، بالعكس: الرقم الأصغر = أخطر (0 Emergency).", "lec": "L4"}, {"t": "tf", "q": "NTP ensures synchronized time across network devices.", "a": true, "ar": "صح، NTP يزامن وقت الأجهزة مع سيرفر وقت موثوق.", "lec": "L4"}, {"t": "tf", "q": "Router hardening includes disabling unused ports and services.", "a": true, "ar": "صح، تقوية الراوتر تشمل إيقاف المنافذ والخدمات غير المستخدمة.", "lec": "L3"}, {"t": "tf", "q": "RADIUS encrypts the entire packet during transmission.", "a": false, "ar": "خطأ، RADIUS يشفّر كلمة المرور فقط، واللي يشفّر الباكيت كامل هو TACACS+.", "lec": "L4"}, {"t": "tf", "q": "AAA stands for Authentication, Authorization, and Accounting.", "a": true, "ar": "صح، AAA = المصادقة والتفويض والمحاسبة.", "lec": "L4"}, {"t": "tf", "q": "Defense-in-depth uses multiple security layers.", "a": true, "ar": "صح، الدفاع بالعمق يعتمد على عدة طبقات حماية بدل طبقة وحدة.", "lec": "L3"}, {"t": "essay", "q": "Explain the defense-in-depth security approach. Describe its components and why it is more secure than the single router approach.", "model": ["Defense-in-depth uses multiple layers of security instead of one device.", "Components: <b>Edge router</b> (first line of defense) → <b>Firewall</b> (second line, filters & tracks connections) → <b>Internal router</b> (protects the internal LAN).", "A DMZ can hold public servers between them.", "More secure: if one layer fails or is bypassed, the next layer still protects the network (no single point of failure)."], "ar": "الفكرة: بدل ما نعتمد على راوتر واحد، نحط عدة طبقات. الـ Edge router أول خط، بعده الجدار الناري، بعده الراوتر الداخلي. لو المهاجم عدّى طبقة، تصدّه اللي بعدها.", "lec": "L3"}, {"t": "essay", "q": "Discuss the importance of securing remote access to routers. Include risks of plaintext protocols and recommended security practices.", "model": ["Remote access lets admins manage routers over the network, so it is a target for attackers.", "Risk: <b>Telnet</b> (and other plaintext protocols) send usernames/passwords in clear text → can be sniffed.", "Practices: use <b>SSH</b> instead of Telnet, strong passwords, limit access to specific IPs (ACL on VTY), use AAA, session timeouts, log access."], "ar": "الوصول عن بعد للراوتر خطير لو كان بـ Telnet لأن كلمة المرور تنكشف. الحل: SSH مشفّر، كلمات مرور قوية، نحدد مين يدخل بـ ACL، ونستخدم AAA ونسجّل الدخول.", "lec": "L3"}, {"t": "essay", "q": "Explain how SNMP works. Describe the roles of the SNMP manager, agent, and MIB.", "model": ["SNMP is an application-layer protocol used to monitor and manage network devices.", "<b>Manager</b>: runs management software; uses <b>get</b> to read and <b>set</b> to change configuration; polls agents on <b>UDP 161</b>.", "<b>Agent</b>: software on the managed device; answers requests and sends <b>traps</b> to the manager on <b>UDP 162</b>.", "<b>MIB</b>: database on the device that stores its data and operational statistics.", "SNMPv3 adds authentication, encryption and integrity."], "ar": "المانجر يسأل (get) ويعدّل (set)، والإيجنت على الجهاز يرد ويرسل تنبيهات (trap)، والـ MIB هي اللي فيها بيانات الجهاز. احفظ المنافذ 161 و 162، وإن v3 هو الآمن.", "lec": "L4"}, {"t": "essay", "q": "Discuss the AAA framework. Explain authentication, authorization, and accounting with examples.", "model": ["<b>Authentication</b>: prove identity — e.g., “I am user ‘student’ and I know the password.”", "<b>Authorization</b>: what the user can access/do — e.g., “student can access serverXYZ using SSH only.”", "<b>Accounting</b>: record what the user did — e.g., “student accessed serverXYZ via SSH for 15 minutes.” Used for auditing/billing.", "Modes: <b>Local AAA</b> (small networks) or <b>Server-based AAA</b> using RADIUS / TACACS+ (many devices, central management)."], "ar": "اكتب الثلاث مع أمثلة الدكتور نفسها، وأضف نوعين المصادقة: محلية للشبكات الصغيرة، وسيرفر مركزي (RADIUS / TACACS+) للشبكات الكبيرة.", "lec": "L4"}, {"t": "essay", "q": "Compare TACACS+ and RADIUS in terms of encryption, ports used, and functionality.", "model": ["<b>Encryption</b>: TACACS+ encrypts the entire communication; RADIUS encrypts the password only.", "<b>Ports</b>: TACACS+ uses TCP port 49; RADIUS uses UDP.", "<b>Functionality</b>: TACACS+ separates authentication and authorization (per-user/per-group policies); RADIUS combines them and supports detailed accounting (ISP billing), 802.1X and SIP."], "ar": "جدول المقارنة: التشفير (كامل ضد كلمة المرور)، المنفذ (TCP 49 ضد UDP)، الوظيفة (يفصل ضد يدمج). اكتبه كجدول في الاختبار.", "lec": "L4"}]}, {"title": "Tasks 5 - 6", "note": "أسئلة محاضرة 5 (ACL) ومحاضرة 6 (Firewalls)", "items": [{"t": "mcq", "q": "What is the main purpose of an ACL?", "o": ["Encrypt data", "Filter packets based on rules", "Increase bandwidth", "Store data"], "a": 1, "ar": "الـ ACL مجموعة قواعد (permit/deny) تفلتر الباكيتات حسب معلومات الهيدر.", "lec": "L5"}, {"t": "mcq", "q": "Standard ACLs filter traffic based on:", "o": ["Destination IP", "Source IP only", "Port numbers", "Protocol type"], "a": 1, "ar": "القياسية تفلتر بعنوان المصدر فقط (Layer 3).", "lec": "L5"}, {"t": "mcq", "q": "Extended ACLs can filter based on:", "o": ["Only source IP", "Only destination IP", "Source, destination, ports, and protocol", "MAC address"], "a": 2, "ar": "الممتدة تفلتر بالمصدر والوجهة والبورتات ونوع البروتوكول (Layer 3 + 4).", "lec": "L5"}, {"t": "mcq", "q": "Circuit-Level gateway works at which layer(s) _____________ ?", "o": ["Layer 1 & 2", "Layer 4 & 5", "Layer 5 & 6", "Layer 7"], "a": 1, "ar": "بوابة الدائرة بروكسي لـ TCP/UDP في طبقة النقل والجلسة، يعني Layer 4 و 5.", "lec": "L6"}, {"t": "mcq", "q": "What does a wildcard mask bit “0” mean?", "o": ["Ignore bit", "Match bit", "Block packet", "Encrypt data"], "a": 1, "ar": "في الوايلد كارد: 0 = طابق البت، 1 = تجاهله (عكس السبنت ماسك).", "lec": "L5"}, {"t": "mcq", "q": "What happens if no ACL rule matches a packet?", "o": ["It is allowed", "It is encrypted", "It is denied (implicit deny)", "It is delayed"], "a": 2, "ar": "في آخر كل ACL فيه منع ضمني (implicit deny)، فالباكيت اللي ما تطابق شي تنرمى.", "lec": "L5"}, {"t": "mcq", "q": "A packet filtering firewall is also called:", "o": ["Stateful firewall", "Application gateway", "Stateless firewall", "Proxy server"], "a": 2, "ar": "فلتر الباكيتات ما يحفظ حالة الاتصالات، فاسمه Stateless firewall (ويسمى screening host).", "lec": "L6"}, {"t": "mcq", "q": "Stateful firewalls:", "o": ["Do not track connections", "Track connection states", "Only check IP address", "Ignore packets"], "a": 1, "ar": "ذو الحالة يتتبع حالة الاتصالات بجدول state table.", "lec": "L6"}, {"t": "mcq", "q": "Application gateways operate at which layer?", "o": ["Network layer", "Transport layer", "Application layer", "Data link layer"], "a": 2, "ar": "بوابة التطبيق (application proxy) تشتغل في طبقة التطبيق.", "lec": "L6"}, {"t": "mcq", "q": "Circuit-level gateways mainly work at:", "o": ["Application layer", "Session/Transport layer", "Physical layer", "Data link layer"], "a": 1, "ar": "بوابة الدائرة في طبقة الجلسة/النقل.", "lec": "L6"}, {"t": "tf", "q": "ACLs are evaluated from top to bottom.", "a": true, "ar": "صح، الراوتر يقارن الأسطر بالترتيب من فوق لتحت ويوقف عند أول تطابق.", "lec": "L5"}, {"t": "tf", "q": "Routers use ACLs to control traffic flow.", "a": true, "ar": "صح، من استخدامات الـ ACL التحكم بتدفق الترافيك.", "lec": "L5"}, {"t": "tf", "q": "Extended ACLs cannot filter by port numbers.", "a": false, "ar": "خطأ، الممتدة تقدر تفلتر بالبورتات (eq, gt, lt, neq).", "lec": "L5"}, {"t": "tf", "q": "Packet filtering examines packet data and packet streaming", "a": false, "ar": "خطأ، فلتر الباكيتات يشوف الهيدر بس، وما يشوف البيانات ولا يتتبع الـ stream.", "lec": "L6"}, {"t": "tf", "q": "In wildcard masks, 1 means ignore the bit.", "a": true, "ar": "صح، 1 = تجاهل، 0 = طابق.", "lec": "L5"}, {"t": "tf", "q": "Stateful firewalls are more secure than stateless firewalls.", "a": true, "ar": "صح، لأنه فاهم سياق الاتصال وأقل عرضة لهجمات الإغراق.", "lec": "L6"}, {"t": "tf", "q": "Packet filtering firewalls track connection states.", "a": false, "ar": "خطأ، هذا شغل الـ Stateful. فلتر الباكيتات Stateless.", "lec": "L6"}, {"t": "tf", "q": "Application gateways require authentication.", "a": true, "ar": "صح، يتحقق من تطبيق العميل أولاً وبعدين من المستخدم.", "lec": "L6"}, {"t": "tf", "q": "Circuit-level gateways inspect application data deeply.", "a": false, "ar": "خطأ، بوابة الدائرة ما تتدخل في البيانات، تمرر الـ stream بس. اللي يفحص بعمق هي بوابة التطبيق.", "lec": "L6"}, {"t": "tf", "q": "Firewalls can completely prevent all attacks.", "a": false, "ar": "خطأ، من حدود الجدار الناري: ما يحمي من الهجمات الداخلية ولا من البرمجيات الخبيثة داخل البيانات، ويعطي إحساس كاذب بالأمان.", "lec": "L6"}, {"t": "essay", "q": "Explain how ACLs work in routers and describe the packet filtering process step-by-step.", "model": ["An ACL is a sequential list of permit/deny statements (ACEs) applied to an interface (inbound or outbound).", "1. The router extracts the source IPv4 address from the packet header.", "2. It compares it with each ACE from the top, in sequential order.", "3. On the first match it permits or denies the packet; remaining ACEs are not checked.", "4. If nothing matches, the packet is discarded by the <b>implicit deny</b>.", "Inbound ACL filters before routing (efficient); outbound after routing."], "ar": "اكتب الخطوات الأربع بالترتيب مثل شريحة الدكتور، ولا تنسى الـ implicit deny والفرق بين inbound و outbound.", "lec": "L5"}, {"t": "essay", "q": "Compare Standard ACLs vs Extended ACLs in terms of functionality and use cases.", "model": ["<b>Standard</b>: filters by source IPv4 only (Layer 3); numbers 1–99, 1300–1999; e.g. <code>access-list 10 permit 192.168.1.0 0.0.0.255</code>. Simple network-wide permit/deny.", "<b>Extended</b>: filters by source and/or destination IP, protocol (ip/tcp/udp/icmp), and TCP/UDP ports (Layer 3 & 4); numbers 100–199, 2000–2699; e.g. <code>access-list 100 permit tcp 192.168.1.0 0.0.0.255 172.16.0.0 0.0.0.255 eq 80</code>. Finer control (allow only HTTP, block ping…), and the <code>established</code> keyword."], "ar": "قارن في جدول: على وش تفلتر، الطبقة، الأرقام، ومثال أمر لكل وحدة من المحاضرة.", "lec": "L5"}, {"t": "essay", "q": "Discuss the differences between stateless and stateful firewalls, including advantages and limitations.", "model": ["<b>Stateless (packet filter / screening host)</b>: checks each packet's header (src/dst IP, ports, protocol) alone; fast and simple. Limitations: no tracking, no authentication, header only, vulnerable to SYN/Ping floods.", "<b>Stateful (dynamic packet filter)</b>: keeps a connection state table, knows if a packet belongs to an existing stream; less susceptible to flood attacks and more secure — recommended when possible. Limitation: needs more resources/processing."], "ar": "الفرق الجوهري: الـ Stateless يحكم على كل باكيت لحالها من الهيدر، والـ Stateful يتذكر الاتصالات بجدول حالات. اذكر العيوب من شريحة الدكتور.", "lec": "L6"}, {"t": "essay", "q": "Explain the working principle of an application gateway and how it improves network security.", "model": ["An application gateway (application proxy) is a program running on the firewall at the application layer.", "It examines the connection between client and server applications; the admin specifies which applications are allowed.", "The client application is authenticated first, then the user (info stored locally or on RADIUS/TACACS+).", "Security: deep inspection of application data, hides internal hosts (only the proxy is seen), computers behind it are protected.", "Cost: each protocol needs its own gateway, more resources, more latency."], "ar": "بوابة التطبيق وسيط بين العميل والسيرفر، تتحقق من التطبيق ثم المستخدم، وتفحص البيانات بعمق وتخفي الأجهزة الداخلية. اذكر العيوب كخاتمة.", "lec": "L6"}, {"t": "essay", "q": "Compare Application Gateway vs Circuit-Level Gateway in terms of: Security level · Performance · Layer of operation", "model": ["<b>Security level</b>: Application gateway is higher (inspects application data, authenticates client app then user); circuit-level gateway is lower (authenticates the user only, does not inspect data).", "<b>Performance</b>: application gateway is slower (more resources, latency, one proxy per protocol); circuit-level gateway is faster (just relays the TCP/UDP stream).", "<b>Layer</b>: application gateway — Application layer (7); circuit-level gateway — Transport/Session layer (4–5), e.g. SOCKS on TCP 1080."], "ar": "ثلاث نقاط بالضبط مثل السؤال: الأمان (التطبيق أعلى)، الأداء (الدائرة أسرع)، الطبقة (7 ضد 4-5).", "lec": "L6"}]}]}];
const PYLAB = "https://morede99-source.github.io/python-lab/";

function bd(s) {
  return s.replace(/[^؀-ۿ،؛]+/g, m => {
    if (!/[0-9A-Za-zΩπω√]/.test(m)) return m;
    let pre = "", post = "", core = m;
    const lead = core.match(/^[\s):·،.]+/); if (lead) { pre = lead[0]; core = core.slice(pre.length); }
    const tail = core.match(/[\s(:·،]+$/); if (tail) { post = tail[0]; core = core.slice(0, -post.length); }
    const o = (core.match(/\(/g) || []).length, c = (core.match(/\)/g) || []).length;
    if (c > o && core.endsWith(")")) { core = core.slice(0, -1); post = ")" + post; }
    return pre + `<bdi dir="ltr">${core}</bdi>` + post;
  });
}

    <a class="card" href="#/${S.slug}/${t.slug}">
      <span class="glow" style="background:${GLOW[i % 4]}"></span>
      <span class="ic">${t.icon}</span><h3>${t.title}</h3><p>${t.idea[0].replace(/<[^>]+>/g, "")}</p>
      <div class="meta"><span class="chip y">${t.lec}</span>${t.dur ? `<span class="chip">▶ ${fmt(t.dur)}</span>` : `<span class="chip">🎬 الفيديو قريباً</span>`}${t.grade ? `<span class="chip g">5 درجات</span>` : ""}</div></a>`).join("")}
    ${S.quiz ? `<a class="card quizcard" href="#/${S.slug}/quiz"><span class="glow" style="background:#FF8A80"></span><span class="ic">🧪</span><h3>اختبر نفسك — بنك الأسئلة</h3>
      <p>${S.quiz.map(q => q.title).join(" · ")} — الأسئلة بالإنجليزي مثل ما هي، وشرح عربي لكل إجابة</p>
      <div class="meta"><span class="chip y">MCQ · True/False · Essay</span><span class="chip">${S.quiz.reduce((a, q) => a + q.items.length, 0)} سؤال</span></div></a>` : ""}
  </div>`;
}

function topic(S, t) {
  document.title = t.title + " — منصة الشروحات";
  const ex = t.example;
  app.innerHTML = `${crumbs(`<a href="#/${S.slug}">${S.title}</a>`, `<span>${t.title}</span>`)}
  <h1 style="font-size:clamp(22px,3.4vw,34px);margin-bottom:14px">${t.icon} ${t.title}</h1>
  ${t.dur ? "" : `<div class="panel" style="margin-top:0;text-align:center;padding:40px 20px"><div style="font-size:44px">🎬</div><h3 style="justify-content:center">الفيديو المشروح قيد التجهيز</h3><p style="color:var(--mut)">الشرح المكتوب جاهز تحت 👇</p></div>`}
  <div class="tp" style="${t.dur ? "" : "display:none"}">
    <div class="player"><video id="vid" controls playsinline preload="metadata" ${t.dur ? `src="video/${t.slug}.mp4"` : ""}></video></div>
    <div class="chap"><h4>فصول الفيديو</h4>${t.chapters.map((c, i) => `<button data-t="${c.t}"><span class="n">${i + 1}</span><span>${c.title}</span><span class="tm">${fmt(c.t)}</span></button>`).join("")}</div>
  </div>
  <div class="panel"><h3>📌 ${t.ideaTitle || "الفكرة والقواعد"}</h3><ul>${t.idea.map(x => `<li>${x}</li>`).join("")}</ul><div class="src">المصدر: ${t.lec}</div></div>
  ${ex ? `<div class="two">
    <div class="panel"><h3>✍️ ${ex.title}</h3>${ex.given ? `<div class="given">${bd(ex.given)}</div>` : ""}<ol class="steps">${ex.steps.map(s => `<li>${bd(s)}</li>`).join("")}</ol></div>
    ${ex.extra ? `<div class="panel"><h3>✍️ ${ex.extra.title}</h3><ol class="steps">${ex.extra.steps.map(s => `<li>${bd(s)}</li>`).join("")}</ol></div>` : ""}
  </div>` : ""}
  ${t.grade ? `<div class="two">
    <div class="panel"><h3>🎯 توزيع الدرجات (متوقع)</h3><table class="gt">${t.grade.map(g => `<tr><td>${g[0]}</td><td>${g[1]}</td></tr>`).join("")}<tfoot><tr><td>المجموع</td><td>${t.grade.reduce((a, g) => a + g[1], 0)}</td></tr></tfoot></table></div>
    <div class="panel"><h3>🧪 سؤال تدريب</h3><div class="q">${bd(t.practice.q)}</div><button class="reveal" id="rv">اعرض الحل</button>
      <div class="ans" id="ans"><ol class="steps">${t.practice.a.map(s => `<li>${bd(s)}</li>`).join("")}</ol></div></div>
  </div>` : ""}
  ${S.quiz ? `<a class="panel gotoquiz" href="#/${S.slug}/quiz">🧪 اختبر نفسك على بنك الأسئلة ←</a>` : ""}`;
  const rv = $("#rv"); if (rv) rv.onclick = () => { const a = $("#ans"); a.classList.toggle("on"); rv.textContent = a.classList.contains("on") ? "إخفاء الحل" : "اعرض الحل"; };
  if (!t.dur) return;
  const v = $("#vid"), bs = [...document.querySelectorAll(".chap button")];
  bs.forEach(b => b.onclick = () => { v.currentTime = +b.dataset.t + 0.05; v.play(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  v.ontimeupdate = () => { let k = 0; t.chapters.forEach((c, i) => { if (v.currentTime >= c.t) k = i; }); bs.forEach((b, i) => b.classList.toggle("on", i === k)); };
}

function quiz(S) {
  document.title = "اختبار — " + S.title;
  let n = 0;
  const lecName = l => ({ L3: "Lecture 3", L4: "Lecture 4", L5: "Lecture 5", L6: "Lecture 6" })[l] || l;
  const part = (q, label) => `<div class="qpart"><h2 class="sec">${label}</h2>${q.map(it => {
    const id = n++;
    if (it.t === "mcq") return `<div class="qc" data-id="${id}" data-a="${it.a}"><div class="qh"><span class="qn">${id + 1}</span><span class="qt" dir="ltr">${it.q}</span><span class="lec">${lecName(it.lec)}</span></div>
      <div class="opts" dir="ltr">${it.o.map((o, k) => `<button class="opt" data-k="${k}"><b>${"ABCD"[k]}</b> ${o}</button>`).join("")}</div>
      <div class="exp"><div class="verdict"></div><div class="ar">${bd(it.ar)}</div></div></div>`;
    if (it.t === "tf") return `<div class="qc" data-id="${id}" data-a="${it.a ? 0 : 1}"><div class="qh"><span class="qn">${id + 1}</span><span class="qt" dir="ltr">${it.q}</span><span class="lec">${lecName(it.lec)}</span></div>
      <div class="opts tf" dir="ltr"><button class="opt" data-k="0"><b>T</b> True</button><button class="opt" data-k="1"><b>F</b> False</button></div>
      <div class="exp"><div class="verdict"></div><div class="ar">${bd(it.ar)}</div></div></div>`;
    return `<div class="qc essay"><div class="qh"><span class="qn">${id + 1}</span><span class="qt" dir="ltr">${it.q}</span><span class="lec">${lecName(it.lec)}</span></div>
      <button class="reveal es">اعرض نموذج الإجابة</button>
      <div class="exp"><div class="model" dir="ltr"><div class="mh">Model answer</div><ul>${it.model.map(x => `<li>${x}</li>`).join("")}</ul></div><div class="ar"><b>💡 الشرح:</b> ${bd(it.ar)}</div></div></div>`;
  }).join("")}</div>`;
  app.innerHTML = `${crumbs(`<a href="#/${S.slug}">${S.title}</a>`, `<span>اختبار بنك الأسئلة</span>`)}
  <section class="hero" style="padding-bottom:10px"><h1>🧪 اختبر نفسك — <span>بنك الأسئلة</span></h1><p>الأسئلة من ملفات الدكتور (Tasks) بالإنجليزي مثل ما هي. اختر إجابتك وبيطلع لك الصح مع شرح عربي.</p></section>
  <div class="score panel" id="score">النتيجة: <b id="sc">0</b> / <span id="tot">0</span> <button class="share" id="reset">↺ إعادة</button></div>
  ${S.quiz.map(Q => `<div class="panel qset"><h3>📄 ${Q.title}</h3><p class="src">${Q.note}</p></div>
    ${part(Q.items.filter(x => x.t === "mcq"), "Part 1 — Multiple Choice")}
    ${part(Q.items.filter(x => x.t === "tf"), "Part 2 — True / False")}
    ${part(Q.items.filter(x => x.t === "essay"), "Part 3 — Essay Questions")}`).join("")}`;
  let sc = 0, tot = 0;
  document.querySelectorAll(".qc:not(.essay)").forEach(card => {
    card.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (card.classList.contains("done")) return;
      card.classList.add("done"); tot++;
      const ok = +b.dataset.k === +card.dataset.a; if (ok) sc++;
      b.classList.add(ok ? "right" : "wrong");
      card.querySelector(`.opt[data-k="${card.dataset.a}"]`).classList.add("right");
      card.querySelector(".verdict").innerHTML = ok ? "✅ إجابة صحيحة" : "❌ إجابة خاطئة — الصح مظلل بالأخضر";
      card.querySelector(".exp").classList.add("on");
      $("#sc").textContent = sc; $("#tot").textContent = tot;
    });
  });
  document.querySelectorAll(".es").forEach(b => b.onclick = () => { const e = b.nextElementSibling; e.classList.toggle("on"); b.textContent = e.classList.contains("on") ? "إخفاء نموذج الإجابة" : "اعرض نموذج الإجابة"; });
  $("#reset").onclick = () => quiz(S);
}

function route() {
  let h = location.hash.replace(/^#\/?/, "").split("/");
  const S = SUBJ.find(x => x.slug === h[0]);
  if (!S) home();
  else if (!h[1]) subject(S);
  else if (h[1] === "quiz" && S.quiz) quiz(S);
  else { const t = S.topics.find(x => x.slug === h[1]); t ? topic(S, t) : subject(S); }
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route); route();

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2200); }
$("#shareBtn").onclick = async () => {
  const url = location.href;
  try { if (navigator.share) { await navigator.share({ title: document.title, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); toast("تم نسخ الرابط ✓"); } catch (e) { prompt("انسخ الرابط:", url); }
};
</script>
</body>
</html>
